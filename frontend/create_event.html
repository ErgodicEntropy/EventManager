<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Event</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-900 antialiased">

  <div class="min-h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    
    <!-- Header -->
    <div class="sm:mx-auto sm:w-full sm:max-w-2xl px-4 sm:px-0">
      <nav class="flex items-center space-x-2 text-sm font-medium text-slate-500 mb-2">
        <a href="#" class="hover:text-indigo-600 transition">Events</a>
        <span class="text-slate-400">/</span>
        <span class="text-slate-900">Create new</span>
      </nav>
      <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">Create an Event</h1>
      <p class="mt-1 text-sm text-slate-500">Fill out the details below to publish your new event.</p>
    </div>

    <!-- Form Container -->
    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-2xl px-4 sm:px-0">
      <div class="bg-white py-8 px-6 border border-slate-200 rounded-2xl shadow-sm sm:px-10">
        
        <form action="../backend/create_event.php" method="POST" class="space-y-6">
          
          <!-- Hidden Organizer ID (Assuming logged-in user context) -->
          <input type="hidden" name="organizer_id" value="1"> <!-- Dynamic ID from session -->

          <!-- Event Title -->
          <div>
            <label for="title" class="block text-sm font-semibold text-slate-700 mb-1.5">Event Title</label>
            <input type="text" id="title" name="title" required
                   placeholder="e.g., Tech Global Summit 2026"
                   class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
          </div>

          <!-- Description -->
          <div>
            <label for="description" class="block text-sm font-semibold text-slate-700 mb-1.5">Description</label>
            <textarea id="description" name="description" rows="4" required
                      placeholder="Outline the goals, agenda, or prerequisites for attendees..."
                      class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm resize-none"></textarea>
          </div>

          <!-- Category & Capacity Row -->
          <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-4">
            <!-- Category -->
            <div>
              <label for="category" class="block text-sm font-semibold text-slate-700 mb-1.5">Category</label>
              <select id="category" name="category" required
                      class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 bg-white text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
                <option value="" disabled selected>Select a category</option>
                <option value="conference">Conference</option>
                <option value="workshop">Workshop</option>
                <option value="webinar">Webinar</option>
                <option value="networking">Networking</option>
              </select>
            </div>

            <!-- Capacity -->
            <div>
              <label for="capacity" class="block text-sm font-semibold text-slate-700 mb-1.5">Max Capacity</label>
              <input type="number" id="capacity" name="capacity" min="1" required
                     placeholder="e.g., 150"
                     class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
            </div>
          </div>

          <!-- Start Date & End Date Row -->
          <div class="grid grid-cols-1 gap-y-6 sm:grid-cols-2 sm:gap-x-4">
            <!-- Start Date -->
            <div>
              <label for="startDate" class="block text-sm font-semibold text-slate-700 mb-1.5">Start Date & Time</label>
              <input type="datetime-local" id="startDate" name="startDate" required
                     class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
            </div>

            <!-- End Date -->
            <div>
              <label for="endDate" class="block text-sm font-semibold text-slate-700 mb-1.5">End Date & Time</label>
              <input type="datetime-local" id="endDate" name="endDate" required
                     class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
            </div>
          </div>

          <!-- Divider -->
          <div class="border-t border-slate-100 pt-5"></div>

          <!-- Form Actions -->
          <div class="flex items-center justify-end space-x-3">
            <a      href="./index.html" 
                    class="rounded-lg px-4 py-2.5 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition border border-slate-200">
              Cancel
          </a>
            <button type="submit" 
                    class="rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition">
              Create Event
            </button>
          </div>

        </form>
        
      </div>
    </div>
  </div>

</body>
</html>
