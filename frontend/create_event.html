<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">

<nav class="bg-white shadow-md p-4">
  <h1 class="text-xl font-bold text-blue-600">Create Event</h1>
</nav>

<div class="max-w-lg mx-auto mt-6">

<form action="../backend/create_event.php" method="POST"
      class="bg-white p-6 rounded-xl shadow">

  <input name="title" placeholder="Event Title"
         class="w-full mb-3 p-3 border rounded">

  <textarea name="description" placeholder="Description"
            class="w-full mb-3 p-3 border rounded"></textarea>

  <input type="datetime-local" name="date"
         class="w-full mb-3 p-3 border rounded">

  <input name="location" placeholder="Location"
         class="w-full mb-3 p-3 border rounded">

  <button class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
    Create Event
  </button>

</form>

</div>
</body>
</html>
