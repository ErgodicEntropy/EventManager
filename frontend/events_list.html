<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active System Registry Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-900 antialiased">

  <div class="min-h-full py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-4xl mx-auto space-y-8">
      
      <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-200 pb-5">
        <div>
          <nav class="flex items-center space-x-2 text-sm font-medium text-slate-500 mb-2">
            <a href="./panel.html" class="hover:text-indigo-600 transition">Console</a>
            <span class="text-slate-400">/</span>
            <span class="text-slate-900">Comprehensive Analytics</span>
          </nav>
          <h1 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">Active Event Abstraction Stream</h1>
          <p class="mt-1 text-sm text-slate-500">Granular variable verification mapping arrays directly from the Event class configuration.</p>
        </div>
        <a href="./panel.html" class="inline-flex items-center justify-center rounded-lg border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 shadow-sm hover:bg-slate-50 transition">
          ➔ Return to Panel
        </a>
      </div>

      <section id="detailed-events-container" class="space-y-8">
        <div class="text-center py-12 bg-white border border-slate-200 rounded-2xl shadow-sm text-slate-400 italic text-sm">
          Parsing internal entity object collection pipelines...
        </div>
      </section>

    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        const targetContainer = document.getElementById("detailed-events-container");

        try {
            const response = await fetch("../backend/get_events.php");
            if (!response.ok) throw new Error("Transaction payload stream initialization fault.");
            const events = await response.json();

            if (!events || events.length === 0) {
                targetContainer.innerHTML = `
                    <div class="text-center py-12 bg-white border border-slate-200 rounded-2xl shadow-sm">
                        <div class="text-slate-400 text-sm italic">Storage matrix arrays currently initialized empty.</div>
                    </div>`;
                return;
            }

            targetContainer.innerHTML = "";

            events.forEach(event => {
                const registeredCount = Array.isArray(event.registeredUsers) ? event.registeredUsers.length : (parseInt(event.registeredUsersCount) || 0);
                const presentCount = Array.isArray(event.presentUsers) ? event.presentUsers.length : (parseInt(event.presentUsersCount) || 0);
                const totalCapacity = parseInt(event.capacity) || 1;
                
                const occupancyPercent = Math.min(100, Math.round((registeredCount / totalCapacity) * 100));
                const attendancePercent = registeredCount > 0 ? Math.min(100, Math.round((presentCount / registeredCount) * 100)) : 0;

                const ratesArr = event.rates || [];
                const averageRating = ratesArr.length > 0 ? (ratesArr.reduce((a, b) => a + b, 0) / ratesArr.length).toFixed(1) : "N/A";
                const venueObj = event.venue || { name: "Virtual Space", address: "Online Room Link", capacity: totalCapacity, isAvailable: true };

                const card = document.createElement("article");
                card.className = "bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden border-l-4 border-l-indigo-500";
                
                card.innerHTML = `
                    <div class="p-6 sm:p-8 space-y-6">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span class="inline-flex items-center rounded-md bg-indigo-50 px-2 py-1 text-xs font-semibold text-indigo-700 ring-1 ring-inset ring-indigo-700/10 uppercase tracking-wide font-mono">
                                    ${escapeHtml(event.category || 'Tech')}
                                </span>
                                <span class="text-xs text-amber-500 font-bold font-mono">
                                    ★ ${averageRating} (${ratesArr.length} votes)
                                </span>
                            </div>
                            <div class="text-xs text-slate-400 font-mono">
                                Publisher: <span class="text-slate-700 font-semibold">${escapeHtml(event.organizer?.name || 'Organizer #1')}</span>
                            </div>
                        </div>

                        <div class="flex flex-col md:flex-row md:items-start md:justify-between gap-4">
                            <div class="space-y-2 flex-1">
                                <h2 class="text-2xl font-bold text-slate-900 tracking-tight">${escapeHtml(event.title)}</h2>
                                <p class="text-sm text-slate-600 leading-relaxed max-w-3xl">${escapeHtml(event.description || 'No descriptive summary defined.')}</p>
                            </div>
                            <div class="shrink-0 pt-1">
                                <a href="./event_details.html?id=${event.id}" class="inline-flex items-center justify-center rounded-xl bg-slate-900 px-4 py-2.5 text-xs font-bold text-white shadow-sm hover:bg-slate-800 transition tracking-wide group/btn">
                                  <span>View Full Profile</span>
                                  <span class="ml-1.5 transform group-hover/btn:translate-x-0.5 transition-transform">➔</span>
                                </a>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 bg-slate-50 border border-slate-200/60 p-5 rounded-xl text-xs">
                            <div class="space-y-3">
                                <div>
                                    <span class="block text-[10px] text-slate-400 font-mono uppercase font-bold tracking-wider">// Schedule Intervals</span>
                                    <div class="mt-1 text-slate-700 font-sans">
                                        <strong class="text-slate-900">Start:</strong> ${event.startDate || 'N/A'}<br>
                                        <strong class="text-slate-900">End:</strong> ${event.endDate || 'N/A'}
                                    </div>
                                </div>
                                <div>
                                    <span class="block text-[10px] text-slate-400 font-mono uppercase font-bold tracking-wider">// Venue Structure Data ($venue)</span>
                                    <div class="mt-1 text-slate-700 font-sans">
                                        <span class="font-bold text-slate-900">${escapeHtml(venueObj.name)}</span> — <span class="italic text-slate-500">${escapeHtml(venueObj.address)}</span>
                                        <div class="text-[10px] text-slate-400 mt-0.5">Physical limit capacity constraint: ${venueObj.capacity} seats</div>
                                    </div>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div class="space-y-1">
                                    <div class="flex justify-between items-baseline font-mono text-[10px] text-slate-400">
                                        <span>REGISTRATION FILL RATE</span>
                                        <span class="text-slate-900 font-bold font-sans">${occupancyPercent}%</span>
                                    </div>
                                    <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                        <div class="bg-indigo-600 h-2 rounded-full transition-all" style="width: ${occupancyPercent}%"></div>
                                    </div>
                                    <div class="text-[10px] text-slate-400 font-mono text-right">
                                        ${registeredCount} registered / ${totalCapacity} maximum slots
                                    </div>
                                </div>

                                <div class="space-y-1">
                                    <div class="flex justify-between items-baseline font-mono text-[10px] text-slate-400">
                                        <span>ATTENDANCE CONVERSION ($presentUsers)</span>
                                        <span class="text-emerald-600 font-bold font-sans">${attendancePercent}%</span>
                                    </div>
                                    <div class="w-full bg-slate-200 h-2 rounded-full overflow-hidden">
                                        <div class="bg-emerald-500 h-2 rounded-full transition-all" style="width: ${attendancePercent}%"></div>
                                    </div>
                                    <div class="text-[10px] text-slate-400 font-mono text-right">
                                        ${presentCount} checked in from ${registeredCount} reservations
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
                targetContainer.appendChild(card);
            });

        } catch (e) {
            targetContainer.innerHTML = `
                <div class="text-center py-12 bg-rose-50 border border-rose-100 rounded-2xl text-rose-600 font-mono text-xs">
                    // Error parsing live back-end context streaming data: ${e.message}
                </div>`;
        }
    });

    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
