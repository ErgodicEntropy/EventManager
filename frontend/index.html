<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eventify - Discover Events</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-900 antialiased">

  <!-- Header / Navigation Workspace -->
  <header class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex h-16 items-center justify-between">
        
        <!-- Brand Identity -->
        <div class="flex items-center space-x-3">
          <div class="h-9 w-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-lg shadow-sm">
            E
          </div>
          <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-slate-900 to-slate-700 bg-clip-text text-transparent">Eventify</span>
        </div>

        <!-- Global Navigation Links -->
        <nav class="flex items-center space-x-1 sm:space-x-2">
          <a href="index.html" class="rounded-lg bg-slate-100 px-3 py-2 text-sm font-semibold text-indigo-600 transition">Events</a>
          <a href="create_event.html" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition">Create</a>
          <a href="login.html" class="rounded-lg px-3 py-2 text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50 transition">Login</a>
        </nav>

      </div>
    </div>
  </header>

  <!-- Main Feed Context -->
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 pb-16">

    <!-- Control Header Block (Title + Live Search Filter) -->
    <div class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between mb-8 border-b border-slate-200 pb-5">
      <div>
        <h2 class="text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">Upcoming Events</h2>
        <p class="text-sm text-slate-500 mt-0.5">Explore schedules and manage your bookings inside the workspace.</p>
      </div>

      <!-- SaaS Search Bar Frame -->
      <div class="relative w-full sm:w-72">
        <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3">
          <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
          </svg>
        </div>
        <input id="search" type="text" placeholder="Filter events..."
               class="block w-full rounded-xl border border-slate-300 bg-white pl-9 pr-3 py-2 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
      </div>
    </div>

    <!-- Loading Skeleton Interface State -->
    <div id="loading" class="flex flex-col items-center justify-center py-20 space-y-3">
      <div class="h-8 w-8 animate-spin rounded-full border-4 border-slate-200 border-t-indigo-600"></div>
      <p class="text-sm font-medium text-slate-500">Syncing workspace events...</p>
    </div>

    <!-- Reactive Events Display Grid -->
    <div id="events" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></div>

  </main>

  <!-- Modern Interactive Action Toast Notification component container -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 flex max-w-sm items-center gap-x-3 rounded-2xl bg-slate-900 p-4 shadow-xl shadow-slate-900/20 text-white transform translate-y-10 opacity-0 pointer-events-none transition-all duration-300">
    <span id="toastIcon" class="text-emerald-400">
      <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </span>
    <p id="toastMessage" class="text-sm font-medium text-slate-200"></p>
  </div>

  <script>
    let allEvents = [];

    // Initialize/Fetch remote endpoints
    fetch('../backend/get_events.php')
      .then(res => res.json())
      .then(events => {
        allEvents = events;
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('events').classList.remove('hidden');
        renderEvents(events);
      })
      .catch(err => {
        document.getElementById('loading').innerText = "Failed to load events. Please refresh.";
        console.error("Initialization Error:", err);
      });

    // Elegant Structural Render Function mapping perfectly to backend attributes
    function renderEvents(events) {
      const container = document.getElementById('events');
      container.innerHTML = '';

      if (!events.length) {
        container.innerHTML = `
          <div class="col-span-full flex flex-col items-center justify-center py-12 text-center bg-white border border-dashed border-slate-300 rounded-2xl p-6">
            <p class="text-sm font-medium text-slate-500">No matches found matching criteria.</p>
          </div>
        `;
        return;
      }

      events.forEach(e => {
        const card = document.createElement('div');
        card.className = "bg-white flex flex-col justify-between border border-slate-200 rounded-2xl shadow-sm p-6 hover:shadow-md hover:border-slate-300/80 transition-all duration-200";

        // Humanize dates from model schemas
        const startString = formatDateRange(e.startDate, e.endDate);
        const categoryVal = e.category ? e.category : "Event";
        const capacityLimit = e.capacity ? `${e.capacity} seats max` : "Open registration";

        card.innerHTML = `
          <div>
            <!-- Header Tag Actions Wrapper -->
            <div class="flex items-center justify-between mb-4">
              <span class="inline-flex items-center rounded-md bg-indigo-50 px-2.5 py-1 text-xs font-semibold text-indigo-700 ring-1 ring-inset ring-indigo-700/10 capitalize">
                ${categoryVal}
              </span>
              <span class="text-xs text-slate-400 font-medium">${capacityLimit}</span>
            </div>

            <!-- Context Title -->
            <h3 class="text-base font-bold text-slate-900 line-clamp-1 mb-2">
              <a href="event_details.html?id=${e.id}" class="hover:text-indigo-600 transition">${e.title}</a>
            </h3>

            <!-- Body Description Snippet -->
            <p class="text-sm text-slate-600 line-clamp-3 leading-6 mb-4">
              ${e.description}
            </p>
          </div>

          <!-- Bottom Meta & Submissions Wrapper -->
          <div class="mt-4 pt-4 border-t border-slate-100">
            <div class="space-y-2 text-xs text-slate-500 font-medium">
              <!-- Location Metadata Column -->
              <div class="flex items-center space-x-2">
                <span class="text-sm">📍</span>
                <span class="truncate">${e.location || 'Online Workspace'}</span>
              </div>
              <!-- Timeline/Dates Metadata Column -->
              <div class="flex items-center space-x-2">
                <span class="text-sm">🗓</span>
                <span>${startString}</span>
              </div>
            </div>

            <!-- Context Button Action Trigger -->
            <button onclick="register(${e.id}, this)"
                    class="mt-5 w-full inline-flex items-center justify-center rounded-xl bg-indigo-600 px-3 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all active:scale-[0.99]">
              Join Event
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Process POST Registration Requests
    function register(id, btn) {
      btn.disabled = true;
      const initialText = btn.innerText;
      btn.innerText = "Joining...";

      fetch('../backend/register_event.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'event_id=' + encodeURIComponent(id)
      })
      .then(res => res.text())
      .then(msg => {
        showToast(msg);
        
        // Transform button design matrix parameters to show state success 
        btn.innerText = "Joined";
        btn.className = "mt-5 w-full inline-flex items-center justify-center rounded-xl bg-emerald-600 px-3 py-2.5 text-sm font-semibold text-white cursor-default";
        btn.onclick = null; // Unbind click handler
      })
      .catch(() => {
        btn.disabled = false;
        btn.innerText = initialText;
        showToast("An unexpected runtime error occurred.");
      });
    }

    // Reactive Live Text Filters Loop Input Logic
    document.getElementById('search').addEventListener('input', e => {
      const query = e.target.value.toLowerCase().trim();

      const filtered = allEvents.filter(ev =>
        ev.title.toLowerCase().includes(query) ||
        ev.description.toLowerCase().includes(query) ||
        (ev.category && ev.category.toLowerCase().includes(query))
      );

      renderEvents(filtered);
    });

    // Global Toast Components Animations System
    function showToast(msg) {
      const toast = document.getElementById('toast');
      const message = document.getElementById('toastMessage');
      
      message.innerText = msg;
      
      // Trigger smooth opacity entry animation
      toast.classList.remove('translate-y-10', 'opacity-0', 'pointer-events-none');
      
      setTimeout(() => {
        toast.classList.add('translate-y-10', 'opacity-0', 'pointer-events-none');
      }, 3500);
    }

    // Dynamic Human-Readable Calendar Formatting System
    function formatDateRange(startStr, endStr) {
      if (!startStr) return 'Date TBD';
      const start = new Date(startStr);
      
      const opt = { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
      const formattedStart = start.toLocaleDateString('en-US', opt);

      if (endStr) {
        const end = new Date(endStr);
        // If it's the same day, just show the time range
        if (start.toDateString() === end.toDateString()) {
          const endOpt = { hour: '2-digit', minute: '2-digit' };
          return `${formattedStart} - ${end.toLocaleTimeString('en-US', endOpt)}`;
        }
        return `${formattedStart} - ${end.toLocaleDateString('en-US', opt)}`;
      }
      
      return formattedStart;
    }
  </script>

</body>
</html>
