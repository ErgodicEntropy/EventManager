<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-6">

<h1 class="text-2xl mb-4">Events</h1>

<div id="events" class="space-y-3"></div>

<script>
fetch('../backend/get_events.php')
.then(res => res.json())
.then(events => {
    let container = document.getElementById('events');

    events.forEach(e => {
        container.innerHTML += `
            <div class="border p-4">
                <h2 class="text-lg">${e.title}</h2>
                <p>${e.description}</p>
                <button onclick="register(${e.id})"
                    class="bg-blue-500 text-white px-2 py-1 mt-2">
                    Register
                </button>
            </div>
        `;
    });
});

function register(id) {
    fetch('../backend/register_event.php', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
        body: 'event_id=' + id
    })
    .then(res => res.text())
    .then(alert);
}
</script>

</body>
</html>
