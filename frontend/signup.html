<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Your Account - SaaS Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex flex-col justify-center py-12 sm:px-6 lg:px-8 text-slate-900 antialiased">

  <div class="sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="flex justify-center mb-6">
      <div class="h-10 w-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-black text-xl shadow-sm">
        S
      </div>
    </div>
    
    <h2 class="text-center text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">
      Create your account
    </h2>
    <p class="mt-1.5 text-center text-sm text-slate-500">
      Get started with your free trial today. No credit card required.
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md px-4 sm:px-0">
    <div class="bg-white py-8 px-6 border border-slate-200 rounded-2xl shadow-sm sm:px-10">
      
      <form action="../backend/signup.php" method="POST" class="space-y-5">
        
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label for="firstName" class="block text-sm font-semibold text-slate-700 mb-1.5">First Name</label>
            <input type="text" id="firstName" name="firstName" required autocomplete="given-name"
                   placeholder="Jane"
                   class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
          </div>

          <div>
            <label for="lastName" class="block text-sm font-semibold text-slate-700 mb-1.5">Last Name</label>
            <input type="text" id="lastName" name="lastName" required autocomplete="family-name"
                   placeholder="Doe"
                   class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
          </div>
        </div>

        <div>
          <label for="username" class="block text-sm font-semibold text-slate-700 mb-1.5">Username</label>
          <div class="relative flex items-center">
            <span class="absolute left-3.5 text-slate-400 text-sm pointer-events-none select-none font-mono">@</span>
            <input type="text" id="username" name="username" required autocomplete="username"
                   placeholder="janedoe"
                   class="block w-full rounded-lg border border-slate-300 pl-8 pr-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
          </div>
        </div>

        <div>
          <label for="email" class="block text-sm font-semibold text-slate-700 mb-1.5">Email address</label>
          <input type="email" id="email" name="email" required autocomplete="email"
                 placeholder="name@company.com"
                 class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
        </div>

        <div>
          <label for="password" class="block text-sm font-semibold text-slate-700 mb-1.5">Password</label>
          <input type="password" id="password" name="password" required autocomplete="new-password"
                 placeholder="At least 8 characters"
                 class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
        </div>

        <div>
          <label for="role" class="block text-sm font-semibold text-slate-700 mb-1.5">Account Workspace Role</label>
          <select id="role" name="role" required
                  class="block w-full rounded-lg border border-slate-300 px-3.5 py-2.5 bg-white text-slate-900 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 transition text-sm">
            <option value="" disabled selected>Select your environment tier</option>
            <option value="participant">Participant (Discover & Attend Events)</option>
            <option value="organizer">Organizer (Publish & Manage Schedules)</option>
          </select>
        </div>

        <div class="flex items-start pt-1">
          <div class="flex items-center h-5">
            <input id="terms" name="terms" type="checkbox" required
                   class="h-4 w-4 rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 cursor-pointer">
          </div>
          <div class="ml-2.5 text-xs">
            <label for="terms" class="text-slate-600 font-medium cursor-pointer select-none">
              I agree to the <a href="#" class="text-indigo-600 hover:text-indigo-500 underline">Terms of Service</a> and <a href="#" class="text-indigo-600 hover:text-indigo-500 underline">Privacy Policy</a>.
            </label>
          </div>
        </div>

        <div class="pt-2">
          <button type="submit" 
                  class="w-full inline-flex items-center justify-center rounded-lg bg-indigo-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all active:scale-[0.98]">
            Get Started
          </button>
        </div>

      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Already have an account? 
        <a href="login.html" class="font-semibold text-indigo-600 hover:text-indigo-500 transition">
          Sign in here
        </a>
      </p>

    </div>
  </div>

</body>
</html>
