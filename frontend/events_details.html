<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Details - SaaS Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-900 antialiased">

  <!-- Main Layout Wrapper -->
  <div class="min-h-full py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-3xl mx-auto">
      
      <!-- Back to Dashboard Navigation -->
      <nav class="mb-6">
        <a href="dashboard.html" class="inline-flex items-center text-sm font-medium text-slate-500 hover:text-indigo-600 transition group">
          <svg class="mr-2 h-4 w-4 text-slate-400 group-hover:text-indigo-500 transition" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
          </svg>
          Back to Events
        </a>
      </nav>

      <!-- Event Card Container -->
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
        
        <!-- Premium Header Accent Banner -->
        <div class="h-32 bg-gradient-to-r from-indigo-500 to-purple-600"></div>
        
        <!-- Content Area -->
        <div class="p-6 sm:p-10">
          
          <!-- Event Category Tag & Title -->
          <div class="flex items-center justify-between gap-4 flex-wrap">
            <span id="category" class="inline-flex items-center rounded-md bg-indigo-50 px-2.5 py-1 text-xs font-semibold text-indigo-700 ring-1 ring-inset ring-indigo-700/10 capitalize">
              Loading...
            </span>
            <div class="flex items-center space-x-1.5 text-sm text-slate-500">
              <span class="inline-block h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
              <span>Open for Registration</span>
            </div>
          </div>

          <h1 id="title" class="mt-4 text-2xl font-bold tracking-tight text-slate-900 sm:text-3xl">
            Loading event title...
          </h1>

          <!-- Meta Grid (Dates, Location, Slots) -->
          <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 border-y border-slate-100 py-6 text-sm text-slate-600">
            
            <!-- Dates Block -->
            <div class="flex items-start space-x-3">
              <svg class="h-5 w-5 text-slate-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 012.25-2.25h13.5A2.25 2.25 0 0121 7.5v11.25m-18 0A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75m-18 0v-7.5A2.25 2.25 0 015.25 9h13.5A2.25 2.25 0 0121 11.25v7.5m-9-6h.008v.008H12v-.008zM12 15h.008v.008H12V15zm0 2.25h.008v.008H12v-.008zM9.75 15h.008v.008H9.75V15zm0 2.25h.008v.008H9.75v-.008zM7.5 15h.008v.008H7.5V15zm0 2.25h.008v.008H7.5v-.008zm6.75-4.5h.008v.008h-.008v-.008zm0 2.25h.008v.008h-.008V15zm0 2.25h.008v.008h-.008v-.008zm2.25-4.5h.008v.008H16.5v-.008zm0 2.25h.008v.008H16.5V15z" />
              </svg>
              <div>
                <span class="block font-semibold text-slate-900">Schedule</span>
                <span id="dateRange" class="text-slate-500 text-xs line-clamp-2">Loading timeline...</span>
              </div>
            </div>

            <!-- Capacity Block -->
            <div class="flex items-start space-x-3">
              <svg class="h-5 w-5 text-slate-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 003.741-.479 3 3 0 00-4.682-2.72m.94 3.198l.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0112 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 016 18.719m12 0a5.971 5.971 0 00-.941-3.197m0 0A5.995 5.995 0 0012 12.75a5.995 5.995 0 00-5.058 2.772m0 0a3 3 0 00-4.681 2.72 8.986 8.986 0 003.74.477m.052-.032l.001-.031c0-.225.012-.447.038-.666A11.94 11.94 0 0112 15c2.17 0 4.207.576 5.963 1.584zM12 7.5a3 3 0 100-6 3 3 0 000 6zM5.25 5.5a2.25 2.25 0 114.5 0 2.25 2.25 0 01-4.5 0zM14.25 5.5a2.25 2.25 0 114.5 0 2.25 2.25 0 01-4.5 0z" />
              </svg>
              <div>
                <span class="block font-semibold text-slate-900">Capacity</span>
                <span id="capacity" class="text-slate-500 text-xs">Loading capacity...</span>
              </div>
            </div>

            <!-- Organizer Block -->
            <div class="flex items-start space-x-3">
              <svg class="h-5 w-5 text-slate-400 flex-shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0012 15.75a7.488 7.488 0 00-5.982 2.975m11.963 0a9 9 0 10-11.963 0m11.963 0A8.966 8.966 0 0112 21a8.966 8.966 0 01-5.982-2.275M15 9.75a3 3 0 11-6 0 3 3 0 016 0z" />
              </svg>
              <div>
                <span class="block font-semibold text-slate-900">Hosted by</span>
                <span id="organizer" class="text-slate-500 text-xs">Loading host name...</span>
              </div>
            </div>

          </div>

          <!-- Description Block -->
          <div class="mt-6">
            <h3 class="text-sm font-semibold text-slate-900">About this event</h3>
            <p id="description" class="mt-2 text-sm leading-6 text-slate-600 whitespace-pre-line">
              Loading description content...
            </p>
          </div>

          <!-- Footer Action Row -->
          <div class="mt-8 pt-6 border-t border-slate-100 flex items-center justify-end">
            <button id="registerBtn"
                    class="inline-flex items-center justify-center rounded-xl bg-indigo-600 px-6 py-3 text-sm font-semibold text-white shadow-sm hover:bg-indigo-500 focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 transition-all duration-200 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
              Join Event
            </button>
          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Client-Side Modern JavaScript Framework Integration -->
  <script>
    const params = new URLSearchParams(window.location.search);
    const eventId = params.get('id');

    // Utility function to human-readably format dates
    function formatDate(dateStr) {
      if (!dateStr) return '';
      const date = new Date(dateStr);
      return date.toLocaleDateString('en-US', { 
        weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
      });
    }

    // Modern async/await Fetch API setup
    async function loadEventData() {
        if (!eventId) {
            document.getElementById('title').innerText = "No Event ID Provided";
            return;
        }

        try {
            const response = await fetch(`../backend/get_event.php?id=${eventId}`);
            if (!response.ok) throw new Error("Network response was not ok");
            
            const event = await response.json();

            // Direct data DOM element injection matching backend models
            document.getElementById('title').innerText = event.title;
            document.getElementById('description').innerText = event.description;
            document.getElementById('category').innerText = event.category || 'General';
            document.getElementById('capacity').innerText = `${event.capacity} total seats`;
            
            // Checking object format for organizer injection
            document.getElementById('organizer').innerText = event.organizer?.name || event.organizer || 'Internal Team';

            // Composing explicit timelines using startDate and endDate properties
            if (event.startDate && event.endDate) {
                document.getElementById('dateRange').innerText = `${formatDate(event.startDate)} - ${formatDate(event.endDate)}`;
            } else {
                document.getElementById('dateRange').innerText = formatDate(event.date) || 'TBD';
            }

        } catch (error) {
            console.error("Fetch Error:", error);
            document.getElementById('title').innerText = "Failed to load event details.";
        }
    }

    // Form Event Listener Submission
    document.getElementById('registerBtn').onclick = async function() {
        const btn = this;
        const originalText = btn.innerText;
        
        // Optimistic UI state manipulation during the API lifetime loop
        btn.disabled = true;
        btn.innerText = "Registering...";

        try {
            const response = await fetch('../backend/register_event.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: `event_id=${encodeURIComponent(eventId)}`
            });
            
            const result = await response.text();
            alert(result);
            
            btn.innerText = "Successfully Registered";
            btn.classList.replace('bg-indigo-600', 'bg-emerald-600');
        } catch (error) {
            alert("Registration request failed. Please try again.");
            btn.disabled = false;
            btn.innerText = originalText;
        }
    };

    // Load Data Execution
    loadEventData();
  </script>

</body>
</html>
