<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Isolated Entity Profile View</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full text-slate-900 antialiased py-12">

  <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
    
    <nav class="flex items-center space-x-2 text-sm font-medium text-slate-500">
      <a href="./events_list.html" class="hover:text-indigo-600 transition-colors">Abstraction Stream</a>
      <span class="text-slate-400">/</span>
      <span class="text-slate-900 font-semibold" id="breadcrumb-title">Event Profile</span>
    </nav>

    <main id="profile-display-card" class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
      <div class="text-center py-20 text-slate-400 italic text-sm">
        Polling direct memory registry allocations for target ID...
      </div>
    </main>
    
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
        const displayShell = document.getElementById("profile-display-card");
        const breadcrumbTitle = document.getElementById("breadcrumb-title");

        // Parse explicit URL query parameter keys
        const urlParams = new URLSearchParams(window.location.search);
        const eventId = urlParams.get('id');

        if (!eventId) {
            displayShell.innerHTML = `
                <div class="p-8 text-center text-rose-600 font-mono text-xs">
                    // Routing Interruption Fault: Critical Event Identifier Token missing in execution context.
                </div>`;
            return;
        }

        try {
            const response = await fetch(`../backend/get_event.php?id=${eventId}`);
            if (!response.ok) throw new Error("Database interface mapping layer returned non-nominal status.");
            const event = await response.json();

            // Set current entity breadcrumb parameters
            breadcrumbTitle.textContent = event.title;

            // Compute metrics properties values sets
            const regCount = intOrZero(event.registeredUsersCount);
            const presentCount = intOrZero(event.presentUsersCount);
            const capacity = intOrZero(event.capacity) || 1;
            const fillRate = Math.min(100, Math.round((regCount / capacity) * 100));
            const conversionRate = regCount > 0 ? Math.min(100, Math.round((presentCount / regCount) * 100)) : 0;
            const avgRating = event.rates?.length ? (event.rates.reduce((a,b)=>a+b,0)/event.rates.length).toFixed(1) : "N/A";

            displayShell.innerHTML = `
                <div class="p-6 sm:p-8 border-b border-slate-100 bg-slate-50/50 flex flex-wrap items-center justify-between gap-4">
                  <div class="space-y-1">
                    <span class="inline-flex items-center rounded-md bg-indigo-50 px-2 py-0.5 text-xs font-semibold text-indigo-700 ring-1 ring-inset ring-indigo-700/10 font-mono tracking-wider uppercase">${escapeHtml(event.category)}</span>
                    <h1 class="text-2xl font-black tracking-tight text-slate-900 sm:text-3xl">${escapeHtml(event.title)}</h1>
                  </div>
                  <a href="./events_list.html" class="rounded-xl bg-white border border-slate-200 px-4 py-2 text-xs font-bold text-slate-700 hover:bg-slate-50 shadow-sm transition">
                    ← Back to Stream
                  </a>
                </div>

                <div class="p-6 sm:p-8 space-y-8">
                  <div class="space-y-3">
                    <h3 class="text-xs font-bold font-mono text-slate-400 uppercase tracking-widest">// Profile Objective Specifications</h3>
                    <p class="text-base text-slate-700 leading-relaxed max-w-none">${escapeHtml(event.description || 'No longform attribute descriptions saved.')}</p>
                  </div>

                  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2">
                    
                    <div class="border border-slate-150 rounded-xl p-5 space-y-4 bg-slate-50/20">
                      <h4 class="text-xs font-bold font-mono text-slate-400 uppercase tracking-wider">// Environmental Allocation Properties</h4>
                      <div class="space-y-2.5 text-sm">
                        <div><span class="text-slate-400 font-medium">Physical Location / Venue:</span> <strong class="text-slate-800 ml-1 block text-base">${escapeHtml(event.venue?.name)}</strong><span class="text-xs text-slate-500">${escapeHtml(event.venue?.address)}</span></div>
                        <div><span class="text-slate-400 font-medium">Scheduled Initialization:</span> <strong class="text-slate-800 block font-mono text-xs mt-0.5">${event.startDate}</strong></div>
                        <div><span class="text-slate-400 font-medium">Scheduled Termination:</span> <strong class="text-slate-800 block font-mono text-xs mt-0.5">${event.endDate}</strong></div>
                        <div class="pt-2 text-xs border-t border-dashed border-slate-200 text-slate-400 font-mono">
                          Managed Key: ${escapeHtml(event.organizer?.name)} (${escapeHtml(event.organizer?.email)})
                        </div>
                      </div>
                    </div>

                    <div class="border border-slate-150 rounded-xl p-5 space-y-5">
                      <h4 class="text-xs font-bold font-mono text-slate-400 uppercase tracking-wider">// Metrics Abstraction Performance</h4>
                      
                      <div class="space-y-1">
                        <div class="flex justify-between items-baseline font-mono text-[10px] text-slate-400">
                          <span>REGISTRATION SATURATION INDEX</span>
                          <span class="text-slate-900 font-bold font-sans text-xs">${fillRate}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                          <div class="bg-indigo-600 h-2 rounded-full" style="width: ${fillRate}%"></div>
                        </div>
                        <div class="text-[10px] text-slate-400 font-mono text-right">${regCount} / ${capacity} Occupied Units</div>
                      </div>

                      <div class="space-y-1">
                        <div class="flex justify-between items-baseline font-mono text-[10px] text-slate-400">
                          <span>ATTENDANCE CONVERSION VELOCITY</span>
                          <span class="text-emerald-600 font-bold font-sans text-xs">${conversionRate}%</span>
                        </div>
                        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
                          <div class="bg-emerald-500 h-2 rounded-full" style="width: ${conversionRate}%"></div>
                        </div>
                        <div class="text-[10px] text-slate-400 font-mono text-right">${presentCount} Verified Check-Ins</div>
                      </div>

                      <div class="pt-1.5 flex items-center justify-between text-xs border-t border-slate-100">
                        <span class="font-mono text-[10px] text-slate-400">AGGREGATE QUALITY METRIC</span>
                        <span class="text-amber-500 font-bold font-mono text-sm">★ ${avgRating} <span class="text-slate-400 text-xs font-sans font-normal">(${event.rates?.length || 0} global samples)</span></span>
                      </div>
                    </div>

                  </div>

                  <div class="space-y-3 pt-2">
                    <h3 class="text-xs font-bold font-mono text-slate-400 uppercase tracking-widest">// Decoupled Evaluation Text Arrays (${event.reviews?.length || 0})</h3>
                    <div class="grid grid-cols-1 gap-3">
                      ${event.reviews?.length ? event.reviews.map(comment => `
                        <div class="p-4 bg-slate-50 border border-slate-200/60 rounded-xl text-xs text-slate-600 font-medium italic shadow-sm">
                          "${escapeHtml(comment)}"
                        </div>
                      `).join('') : `
                        <div class="p-6 bg-slate-50 border border-slate-150 rounded-xl text-center font-mono text-xs text-slate-400 italic">
                          No evaluation records posted to this target index field block array context.
                        </div>
                      `}
                    </div>
                  </div>
                </div>
            `;

        } catch (err) {
            displayShell.innerHTML = `
                <div class="p-8 text-center text-rose-600 font-mono text-xs">
                    // Error connecting to backend query parameters mapping channel: ${err.message}
                </div>`;
        }
    });

    function intOrZero(val) { return parseInt(val) || 0; }
    function escapeHtml(str) { if(!str) return ''; return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  </script>
</body>
</html>
